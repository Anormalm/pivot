name: Lean candidate checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "drafts/**"
      - ".github/workflows/lean-candidates.yml"
  push:
    branches: [loop-telescope]
    paths:
      - "drafts/**"
      - ".github/workflows/lean-candidates.yml"

permissions:
  contents: read

concurrency:
  group: lean-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-lemmas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pivot
        uses: actions/checkout@v4

      - name: Checkout pinned C-HD snapshot
        uses: actions/checkout@v4
        with:
          repository: spicylemonade/c-hd-proof
          ref: 98c53accb47a505482a1781597ae14bf67e81cec
          path: upstream

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: upstream/formal/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Fetch pinned Mathlib cache
        working-directory: upstream/formal/lean
        run: lake exe cache get

      - name: Build required upstream modules
        working-directory: upstream/formal/lean
        run: lake build Frontier.CHD.LoopCost Frontier.Homes Frontier.CHD.DLazyFacts Frontier.CHD.CrBe Frontier.CHD.CostLog Frontier.CHD.CostLe Frontier.CHD.BMTeleChd Frontier.CostAggregate

      - name: Prepare candidate modules
        shell: bash
        run: |
          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/LoopCostFiniteCandidates.lean
          } > upstream/formal/lean/CandidateLoopCostFinite.lean

          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/IterCostRefinedCandidate.lean
          } > upstream/formal/lean/CandidateIterCost.lean

          {
            echo 'import Frontier.Homes'
            cat drafts/HomeOwnColourCandidate.lean
          } > upstream/formal/lean/CandidateHomeOwnColour.lean

          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
          } > upstream/formal/lean/CandidateLoopInsertCredit.lean

          {
            echo 'import Frontier.CHD.DLazyFacts'
            cat drafts/FreshInsertCandidate.lean
          } > upstream/formal/lean/CandidateFreshInsert.lean

          {
            echo 'import Frontier.CHD.CrBe'
            cat drafts/HomeOwnColourCandidate.lean
            cat drafts/MkOwnColourCandidate.lean
          } > upstream/formal/lean/CandidateMkOwnColour.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/RecCostCreditCandidate.lean
          } > upstream/formal/lean/CandidateRecCostCredit.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/RecCostCreditCandidate.lean
            cat drafts/LoopRecCostCreditCandidate.lean
          } > upstream/formal/lean/CandidateLoopRecCostCredit.lean

          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/FinalResidualCandidate.lean
          } > upstream/formal/lean/CandidateFinalResidual.lean

          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
          } > upstream/formal/lean/CandidateFullTerminalCredit.lean

          {
            echo 'import Frontier.CHD.LoopCost'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
            cat drafts/CallCostFullCreditCandidate.lean
          } > upstream/formal/lean/CandidateCallCostFullCredit.lean

          {
            echo 'import Frontier.CHD.CostLe'
            cat drafts/FullCreditCancellationCandidate.lean
          } > upstream/formal/lean/CandidateFullCreditCancellation.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
            cat drafts/RecCostCreditCandidate.lean
            cat drafts/RecordCreditBridgeCandidate.lean
          } > upstream/formal/lean/CandidateRecordCreditBridge.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
            cat drafts/CallCostFullCreditCandidate.lean
            cat drafts/RecCostCreditCandidate.lean
            cat drafts/RecordCreditBridgeCandidate.lean
            cat drafts/RootCreditBudgetCandidate.lean
          } > upstream/formal/lean/CandidateRootCreditBudget.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
            cat drafts/CallCostFullCreditCandidate.lean
            cat drafts/RecCostCreditCandidate.lean
            cat drafts/LoopRecCostCreditCandidate.lean
            cat drafts/RecordCreditBridgeCandidate.lean
            cat drafts/RootCreditBudgetCandidate.lean
            cat drafts/CallRecCostCreditCaseCandidate.lean
          } > upstream/formal/lean/CandidateCallRecCostCreditCase.lean

          {
            echo 'import Frontier.CHD.BMTeleChd'
            echo 'import Frontier.CostSkeleton'
            cat drafts/SqrtParameterCandidate.lean
          } > upstream/formal/lean/CandidateSqrtParameters.lean

          {
            echo 'import Frontier.CHD.CostLog'
            cat drafts/LoopCostFiniteCandidates.lean
            cat drafts/IterCostRefinedCandidate.lean
            cat drafts/LoopCostInsertCreditCandidate.lean
            cat drafts/FinalResidualCandidate.lean
            cat drafts/FullTerminalCreditCandidate.lean
            cat drafts/CallCostFullCreditCandidate.lean
            cat drafts/RecCostCreditCandidate.lean
            cat drafts/LoopRecCostCreditCandidate.lean
            cat drafts/RecordCreditBridgeCandidate.lean
            cat drafts/RootCreditBudgetCandidate.lean
            cat drafts/CallRecCostCreditCaseCandidate.lean
            cat drafts/BMSSPRecCostCreditCaseCandidate.lean
          } > upstream/formal/lean/CandidateBMSSPRecCostCreditCase.lean

          {
            echo 'import Frontier.CostAggregate'
            cat drafts/RefinedAggregateCandidate.lean
          } > upstream/formal/lean/CandidateRefinedAggregate.lean

          {
            echo 'import Frontier.CHD.CostLe'
            cat drafts/FullCreditCancellationCandidate.lean
            cat drafts/FullBudgetArithmeticCandidate.lean
          } > upstream/formal/lean/CandidateFullBudgetArithmetic.lean

      - name: Check all candidate modules
        working-directory: upstream/formal/lean
        shell: bash
        run: |
          status=0
          echo "::group::CandidateLoopCostFinite"
          lake env lean CandidateLoopCostFinite.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateIterCost"
          lake env lean CandidateIterCost.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateHomeOwnColour"
          lake env lean CandidateHomeOwnColour.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateLoopInsertCredit"
          lake env lean CandidateLoopInsertCredit.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateFreshInsert"
          lake env lean CandidateFreshInsert.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateMkOwnColour"
          lake env lean CandidateMkOwnColour.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateRecCostCredit"
          lake env lean CandidateRecCostCredit.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateLoopRecCostCredit"
          lake env lean CandidateLoopRecCostCredit.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateFinalResidual"
          lake env lean CandidateFinalResidual.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateFullTerminalCredit"
          lake env lean CandidateFullTerminalCredit.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateCallCostFullCredit"
          lake env lean CandidateCallCostFullCredit.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateFullCreditCancellation"
          lake env lean CandidateFullCreditCancellation.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateRecordCreditBridge"
          lake env lean CandidateRecordCreditBridge.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateRootCreditBudget"
          lake env lean CandidateRootCreditBudget.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateCallRecCostCreditCase"
          lake env lean CandidateCallRecCostCreditCase.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateSqrtParameters"
          lake env lean CandidateSqrtParameters.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateBMSSPRecCostCreditCase"
          lake env lean CandidateBMSSPRecCostCreditCase.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateRefinedAggregate"
          lake env lean CandidateRefinedAggregate.lean || status=1
          echo "::endgroup::"
          echo "::group::CandidateFullBudgetArithmetic"
          lake env lean CandidateFullBudgetArithmetic.lean || status=1
          echo "::endgroup::"
          exit "$status"

# candidate set revision: 21
